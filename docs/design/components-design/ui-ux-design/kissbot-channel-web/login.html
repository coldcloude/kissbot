<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kissbot Web Chat 登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>Kissbot Web Chat</h1>
    <p class="login-subtitle">管理后台</p>

    <div class="login-section">
      <label class="login-label">选择后端</label>
      <div class="backend-url-list">
        <div class="backend-url-item backend-url-custom" id="custom-backend-item">
          <div class="backend-name">自定义</div>
          <input type="url" id="custom-backend-url" placeholder="输入自定义后端 URL，如 https://api.example.com">
        </div>
        <div class="backend-url-item selected">
          <div class="backend-name">生产环境</div>
          <div class="backend-url">https://api.kissbot.example.com</div>
        </div>
        <div class="backend-url-item">
          <div class="backend-name">测试环境</div>
          <div class="backend-url">http://localhost:8301</div>
        </div>
        <div class="backend-url-item">
          <div class="backend-name">开发环境</div>
          <div class="backend-url">http://192.168.1.100:8301</div>
        </div>
      </div>
    </div>

    <div class="login-section">
      <label class="login-label">Admin Key</label>
      <input type="password" placeholder="输入 Admin API Key" value="sk-••••••••">
    </div>

    <button class="connect-btn">连接</button>
  </div>
</div>
<script>
// 原型交互：选中某个后端或输入自定义 URL 时，高亮对应选项
(function () {
  var list = document.querySelector('.backend-url-list');
  var customItem = document.getElementById('custom-backend-item');
  var customInput = document.getElementById('custom-backend-url');

  function clearSelection() {
    list.querySelectorAll('.backend-url-item').forEach(function (item) {
      item.classList.remove('selected');
    });
  }

  // 点击预制后端项时高亮该项
  list.querySelectorAll('.backend-url-item').forEach(function (item) {
    if (item === customItem) return;
    item.addEventListener('click', function () {
      clearSelection();
      item.classList.add('selected');
    });
  });

  // 聚焦或输入自定义 URL 时高亮自定义项
  ['focus', 'input'].forEach(function (evt) {
    customInput.addEventListener(evt, function () {
      clearSelection();
      customItem.classList.add('selected');
    });
  });
})();
</script>
</body>
</html>
