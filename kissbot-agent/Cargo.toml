[package]
name = "kissbot-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["time"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = { version = "6.1", features = ["serde"] }
kai-ws = { path = "../kai-rs/kai-ws" }
kai-file = { path = "../kai-rs/kai-file" }
bytes = "1.11"
kissbot-api = { path = "../kissbot-api" }
kissbot-security = { path = "../kissbot-security" }
kissbot-channel-client = { path = "../kissbot-channel-client" }
kissbot-config = { path = "../kissbot-config" }
arc-swap = { version = "1.9", features = ["serde"] }
axum = { version = "0.7", features = ["json"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
