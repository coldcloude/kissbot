[package]
name = "kissbot-api"
version = "0.1.0"
edition = "2024"

[dependencies]
arcstr = { version = "1.2", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive","rc"] }
serde_json = "1.0"
serde_bytes = "0.11"
bytes = "1.11"
thiserror = "2.0"
async-trait = "0.1"
kai-ws = { path = "../kai-rs/kai-ws" }
kai-file = { path = "../kai-rs/kai-file" }
kissbot-config = { path = "../kissbot-config" }
