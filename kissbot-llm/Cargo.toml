[package]
name = "kissbot-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
kai-file = { path = "../kai-rs/kai-file" }
kissbot-api = { path = "../kissbot-api" }

[dev-dependencies]
tempfile = "3"
arc-swap = "1.9"
