[package]
name = "kissbot-memory-struct-abstract"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive","rc"] }
serde_json = "1.0"
futures-util = "0.3"
arcstr = { version = "1.2", features = ["serde"] }
dashmap = { version = "6.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["macros"] }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
kissbot-config = { path = "../kissbot-config" }
kai-date = { path = "../kai-rs/kai-date" }
kai-file = { path = "../kai-rs/kai-file" }
kai-ws = { path = "../kai-rs/kai-ws" }
kissbot-api = { path = "../kissbot-api" }
kissbot-memory = { path = "../kissbot-memory" }
kissbot-memory-struct = { path = "../kissbot-memory-struct" }
kissbot-llm = { path = "../kissbot-llm" }
kissbot-security = { path = "../kissbot-security" }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
