[package]
name = "kissbot-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
config = "0.15"
