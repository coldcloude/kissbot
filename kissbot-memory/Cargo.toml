[package]
name = "kissbot-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.51", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = { version = "6.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
config = "0.15"
kai-file = { path = "../kai-rs/kai-file" }
kissbot-api = { path = "../kissbot-api" }
